# Single-tenant pilot: one collector with its web view, one database.
#
#   export SEGURAI_COLLECTOR_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
#   mkdir -p keys && cp /path/to/org.pub keys/org.pub
#   docker compose -f deploy/compose.yaml up -d --build
#
# It listens on 127.0.0.1 only. Put your usual TLS reverse proxy in front of
# it (docs/PILOT_RUNBOOK.md has a two-line Caddy example) - never expose the
# port directly to the internet.

services:
  segurai:
    build:
      context: ..
    image: segurai-collector:0.1.0
    restart: unless-stopped
    environment:
      # Compose stops with this message if the token isn't set.
      SEGURAI_COLLECTOR_TOKEN: ${SEGURAI_COLLECTOR_TOKEN:?set SEGURAI_COLLECTOR_TOKEN to a long random value}
      # The organisation's PUBLIC key. The private key stays with the agents.
      SEGURAI_KEY: /keys/org.pub
    volumes:
      - segurai-data:/data
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:4318:4318"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  segurai-data:

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant-provenance"
dynamic = ["version"]
description = "Provenance and authority for AI agent chains - who authorized what your agents did"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-agents", "authorization", "provenance", "audit", "opentelemetry", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# The core needs only a signing library. Everything else is an optional extra,
# so trying warrant never drags a framework into someone's environment.
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
langgraph = ["langgraph>=1.0"]
mcp = ["mcp>=2.0"]
collector = ["opentelemetry-proto>=1.30"]
intent = ["anthropic>=1.5"]
judge = ["anthropic>=1.5"]
all = ["warrant-provenance[otel,langgraph,mcp,collector,intent,judge]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "warrant-provenance[all]",
]

[project.scripts]
warrant = "warrant.cli:main"

[tool.setuptools.dynamic]
version = { attr = "warrant._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# py.typed tells type checkers the package ships its own type hints.
[tool.setuptools.package-data]
warrant = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segurai"
dynamic = ["version"]
description = "Provenance and authority for AI agent chains - who authorized what your agents did"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-agents", "authorization", "provenance", "audit", "opentelemetry", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# The core needs only a signing library. Everything else is an optional extra,
# so trying Segurai never drags a framework into someone's environment.
dependencies = [
    "cryptography>=42.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
langgraph = ["langgraph>=1.0"]
mcp = ["mcp>=2.0"]
openai-agents = ["openai-agents>=0.24"]
claude-agent = ["claude-agent-sdk>=0.2"]
# CrewAI pulls in a vector database and much else, so it stays out of "all".
crewai = ["crewai>=1.15"]
collector = ["opentelemetry-proto>=1.30"]
identity = ["pyjwt[crypto]>=2.8"]
postgres = ["psycopg[binary]>=3.1"]
server = ["segurai[collector,identity]"]
intent = ["anthropic>=1.5"]
judge = ["anthropic>=1.5"]
all = ["segurai[otel,langgraph,mcp,openai-agents,claude-agent,collector,identity,postgres,intent,judge]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "segurai[all]",
]

[project.scripts]
segurai = "segurai.cli:main"

# Shown in the sidebar of the PyPI project page.
[project.urls]
Homepage = "https://github.com/Yaxomiller/segurai"
Repository = "https://github.com/Yaxomiller/segurai"
Changelog = "https://github.com/Yaxomiller/segurai/blob/master/CHANGELOG.md"
Documentation = "https://github.com/Yaxomiller/segurai/blob/master/docs/ARCHITECTURE.md"
Issues = "https://github.com/Yaxomiller/segurai/issues"

[tool.setuptools.dynamic]
version = { attr = "segurai._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# py.typed tells type checkers the package ships its own type hints.
[tool.setuptools.package-data]
segurai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
